 supreme_muster_warriors_decision:0 "Muster Supreme Warriors"
 supreme_muster_warriors_decision_desc:0 "Call a regiment of Supreme Warriors into your service without working through the military recruit screen."
 supreme_muster_warriors_decision_tooltip:0 "Spend gold to add one Supreme Warriors regiment to your men-at-arms roster."
 supreme_muster_warriors_decision_confirm:0 "Muster the regiment"
 sw_warrior_mobility_decision:0 "Doctrine of Supreme Mobility"
 sw_warrior_mobility_decision_desc:0 "Drill Supreme Warriors and Riders to force-march overland and strike across seas and rivers with unmatched speed."
 sw_warrior_mobility_decision_tooltip:0 "Adopt a permanent doctrine: faster land marches, much faster sea travel, and cheaper embarkation."
 sw_warrior_mobility_decision_confirm:0 "Adopt the doctrine"
 sw_warrior_mobility_modifier:0 "Supreme Mobility"
 sw_warrior_mobility_modifier_desc:0 "Your armies force-march overland (+35% movement speed), race across seas and rivers when embarked (+75% naval speed), march better in winter (+25%), and embark far more cheaply (−75% embarkation cost)."
 sw_warrior_siege_supply_decision:0 "Doctrine of Supreme Siege & Supply"
 sw_warrior_siege_supply_decision_desc:0 "Drill Supreme Warriors and Riders to smash walls at unnatural speed and march without fear of supply or hostile attrition."
 sw_warrior_siege_supply_decision_tooltip:0 "Adopt a permanent doctrine: much faster sieges and near-total supply immunity for your armies."
 sw_warrior_siege_supply_decision_confirm:0 "Adopt the doctrine"
 sw_warrior_siege_supply_modifier:0 "Supreme Siege & Supply"
 sw_warrior_siege_supply_modifier_desc:0 "Your armies resolve sieges far faster (−75% siege phase time), carry absurd supply duration, enjoy a massive supply limit bonus, and ignore hostile county attrition."
 sw_warrior_stand_decision:0 "Doctrine of Supreme Stand"
 sw_warrior_stand_decision_desc:0 "Drill Supreme elites to hold the line — tougher ranks, fewer hard losses, and knights that fight as legends."
 sw_warrior_stand_decision_tooltip:0 "Adopt a permanent doctrine: higher advantage, tougher troops, fewer hard casualties, and stronger knights."
 sw_warrior_stand_decision_confirm:0 "Adopt the doctrine"
 sw_warrior_stand_modifier:0 "Supreme Stand"
 sw_warrior_stand_modifier_desc:0 "Your armies fight to hold: +15 advantage, +30% MAA toughness, +15% levy toughness, −40% hard casualties, +75% knight effectiveness."
 sw_warriors_banner_modifier:0 "Warriors' Banner"
 sw_warriors_banner_modifier_desc:0 "While Supreme elites serve in your host, the whole army fights above its weight: +8 advantage, +20% MAA damage, +10% levy damage, +25% knight effectiveness."
